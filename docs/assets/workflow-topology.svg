<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="100%" height="100%" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#090D16"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="mgrGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>
    <linearGradient id="holdGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#065F46"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8"/>
    </marker>
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38BDF8"/>
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#34D399"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FBBF24"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="780" rx="14" fill="url(#bgGrad)" stroke="#1E293B" stroke-width="2"/>

  <!-- Header Bar -->
  <rect x="24" y="20" width="1152" height="54" rx="8" fill="#111827" stroke="#1F2937"/>
  <circle cx="48" cy="47" r="6" fill="#EF4444"/>
  <circle cx="68" cy="47" r="6" fill="#F59E0B"/>
  <circle cx="88" cy="47" r="6" fill="#10B981"/>
  <text x="114" y="52" fill="#F8FAFC" font-size="16" font-weight="700">Agentic Factory — Single-Leader Maestri Board, Direct QA⇄Dev Cord &amp; On-Disk Cryptographic Gates</text>
  <text x="1156" y="52" fill="#94A3B8" font-size="12" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" text-anchor="end">1 Fact = 1 File · 200k Ceiling</text>

  <!-- TOP LAYER: Human, Manager, Blind Reviewer -->
  <!-- Human Box -->
  <rect x="40" y="96" width="270" height="106" rx="10" fill="#111827" stroke="#F59E0B" stroke-width="1.8"/>
  <rect x="54" y="108" width="84" height="20" rx="4" fill="#451A03"/>
  <text x="96" y="122" fill="#FBBF24" font-size="11" font-weight="700" text-anchor="middle">HUMAN OWNER</text>
  <text x="54" y="148" fill="#F8FAFC" font-size="15" font-weight="700">Developer / Product Lead</text>
  <text x="54" y="168" fill="#94A3B8" font-size="12">• Approves 1-page plan.md &amp; PRDs</text>
  <text x="54" y="186" fill="#94A3B8" font-size="12">• Quotes go to authorization.md · git push</text>

  <!-- Human <-> Manager Cord -->
  <line x1="310" y1="142" x2="418" y2="142" stroke="#FBBF24" stroke-width="2.2" marker-end="url(#arrowAmber)" marker-start="url(#arrowAmber)"/>
  <text x="364" y="132" fill="#FCD34D" font-size="11" font-weight="600" text-anchor="middle">/grill-me &amp; OK</text>
  <text x="364" y="160" fill="#94A3B8" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">authorization.md</text>

  <!-- Manager Box -->
  <rect x="420" y="92" width="360" height="114" rx="12" fill="url(#mgrGrad)" stroke="#818CF8" stroke-width="2.2"/>
  <rect x="436" y="104" width="128" height="20" rx="4" fill="#1E1B4B" stroke="#6366F1"/>
  <text x="500" y="118" fill="#A5B4FC" font-size="11" font-weight="700" text-anchor="middle">SINGLE LEADER · MAESTRO</text>
  <text x="764" y="118" fill="#C7D2FE" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">Claude Opus 5.5</text>
  <text x="436" y="145" fill="#FFFFFF" font-size="17" font-weight="700">Manager Terminal</text>
  <text x="436" y="166" fill="#E0E7FF" font-size="12">• Sole decision channel with Human · Zero code edits</text>
  <text x="436" y="184" fill="#C7D2FE" font-size="11.5" font-family="ui-monospace, monospace">order.py open/reconcile · maestri recruit --replace</text>

  <!-- Manager <-> Blind Reviewer Cord -->
  <line x1="780" y1="142" x2="888" y2="142" stroke="#38BDF8" stroke-width="2" stroke-dasharray="5,4" marker-end="url(#arrowCyan)" marker-start="url(#arrowCyan)"/>
  <text x="834" y="132" fill="#7DD3FC" font-size="11" font-weight="600" text-anchor="middle">Blind 2nd Opinion</text>
  <text x="834" y="160" fill="#94A3B8" font-size="10" font-family="ui-monospace, monospace" text-anchor="middle">Dual Research</text>

  <!-- Blind Reviewer Box -->
  <rect x="890" y="96" width="270" height="106" rx="10" fill="#111827" stroke="#38BDF8" stroke-width="1.6"/>
  <rect x="904" y="108" width="110" height="20" rx="4" fill="#082F49"/>
  <text x="959" y="122" fill="#38BDF8" font-size="11" font-weight="700" text-anchor="middle">BLIND REVIEWER</text>
  <text x="1146" y="122" fill="#7DD3FC" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">AGY Gemini 4</text>
  <text x="904" y="148" fill="#F8FAFC" font-size="15" font-weight="700">Gemini Pool (Argon / Neon)</text>
  <text x="904" y="168" fill="#94A3B8" font-size="12">• Blind trade-off challenger before Human gate</text>
  <text x="904" y="186" fill="#94A3B8" font-size="12">• Paired with Codex for blind dual discovery</text>

  <!-- Dispatch Trunk from Manager -->
  <line x1="600" y1="206" x2="600" y2="246" stroke="#818CF8" stroke-width="2.5"/>
  <line x1="230" y1="246" x2="970" y2="246" stroke="#818CF8" stroke-width="2"/>
  <rect x="445" y="220" width="310" height="22" rx="6" fill="#1E1B4B" stroke="#6366F1"/>
  <text x="600" y="235" fill="#C7D2FE" font-size="11" font-family="ui-monospace, monospace" text-anchor="middle">maestri ask (ORDER / REPORT) + order.py SHA-256</text>

  <!-- Vertical branches down to lanes -->
  <line x1="230" y1="246" x2="230" y2="274" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowIndigo)"/>
  <line x1="820" y1="246" x2="820" y2="274" stroke="#818CF8" stroke-width="2" marker-end="url(#arrowIndigo)"/>

  <!-- MIDDLE LEFT: PRODUCT TEAM LANE -->
  <rect x="40" y="276" width="410" height="296" rx="12" fill="#0B1324" stroke="#334155" stroke-width="1.5"/>
  <text x="60" y="302" fill="#38BDF8" font-size="13" font-weight="700" letter-spacing="0.06em">PRODUCT &amp; SPECIFICATION TEAM</text>
  <text x="432" y="302" fill="#64748B" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">plan.md → ready/*.md</text>

  <!-- Explorer Node -->
  <rect x="58" y="318" width="374" height="72" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="74" y="340" fill="#F8FAFC" font-size="14" font-weight="700">Explorer</text>
  <text x="416" y="340" fill="#38BDF8" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">AGY Gemini 4 Neon / Sonnet 5.5</text>
  <text x="74" y="360" fill="#94A3B8" font-size="12">Codebase fact-finding, writes &amp; verifies PRDs, closes out shipped PRDs</text>
  <text x="74" y="378" fill="#64748B" font-size="11" font-family="ui-monospace, monospace">Skills: /prd · /verify-claims · /prd-ship · /epic-ship · /audit-codebase</text>

  <!-- Designer Node -->
  <rect x="58" y="402" width="374" height="72" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="74" y="424" fill="#F8FAFC" font-size="14" font-weight="700">Designer</text>
  <text x="416" y="424" fill="#38BDF8" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">Codex GPT-6.1 Sol (medium)</text>
  <text x="74" y="444" fill="#94A3B8" font-size="12">Builds 2–3 static HTML options from problem brief before UI PRDs go Ready</text>
  <text x="74" y="462" fill="#64748B" font-size="11" font-family="ui-monospace, monospace">Skills: /design-decide · templates/design/anti-slop.md &amp; taste-rules.md</text>

  <!-- Writer Node -->
  <rect x="58" y="486" width="374" height="72" rx="8" fill="#111827" stroke="#38BDF8" stroke-width="1.4"/>
  <text x="74" y="508" fill="#F8FAFC" font-size="14" font-weight="700">Writer</text>
  <text x="416" y="508" fill="#38BDF8" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">AGY Gemini 4 Neon / Sonnet 5.5</text>
  <text x="74" y="528" fill="#94A3B8" font-size="12">UI microcopy, domain vocabulary, and anti-AI prose humanization passes</text>
  <text x="74" y="546" fill="#64748B" font-size="11" font-family="ui-monospace, monospace">Skills: /humanizer · /humanizer-compact · templates/voice/brand-voice.md</text>

  <!-- MIDDLE RIGHT: ENGINEERING & QA LANE -->
  <rect x="476" y="276" width="684" height="296" rx="12" fill="#0B1324" stroke="#334155" stroke-width="1.5"/>
  <text x="496" y="302" fill="#34D399" font-size="13" font-weight="700" letter-spacing="0.06em">ENGINEERING, QA &amp; PRODUCTION TEAM</text>
  <text x="1140" y="302" fill="#64748B" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">branch prd/&lt;n&gt;-&lt;slug&gt; · 1 PRD at a time</text>

  <!-- Dev Front Node -->
  <rect x="496" y="318" width="310" height="74" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="512" y="340" fill="#F8FAFC" font-size="14" font-weight="700">Dev Front (web/)</text>
  <text x="792" y="340" fill="#34D399" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">Codex GPT-6.1 Sol</text>
  <text x="512" y="359" fill="#94A3B8" font-size="12">TDD (vitest), Design System first, zero layout shift</text>
  <text x="512" y="377" fill="#64748B" font-size="11" font-family="ui-monospace, monospace">/prd-run · /design-port · qa-proof.py record</text>

  <!-- Dev Back Node -->
  <rect x="496" y="402" width="310" height="74" rx="8" fill="#111827" stroke="#10B981" stroke-width="1.5"/>
  <text x="512" y="424" fill="#F8FAFC" font-size="14" font-weight="700">Dev Back (server/)</text>
  <text x="792" y="424" fill="#34D399" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">Codex GPT-6.1 Sol</text>
  <text x="512" y="443" fill="#94A3B8" font-size="12">TDD (pytest), migrations, API contracts &amp; lockfiles</text>
  <text x="512" y="461" fill="#64748B" font-size="11" font-family="ui-monospace, monospace">/prd-run · /commit · qa-proof.py record</text>

  <!-- Direct HOLD Cord between Devs and QA -->
  <line x1="806" y1="355" x2="854" y2="355" stroke="#34D399" stroke-width="2.2" marker-end="url(#arrowEmerald)" marker-start="url(#arrowEmerald)"/>
  <line x1="806" y1="439" x2="854" y2="439" stroke="#34D399" stroke-width="2.2" marker-end="url(#arrowEmerald)" marker-start="url(#arrowEmerald)"/>
  <rect x="810" y="376" width="40" height="40" rx="6" fill="url(#holdGrad)" stroke="#34D399"/>
  <text x="830" y="394" fill="#ECFDF5" font-size="9.5" font-weight="700" text-anchor="middle">HOLD</text>
  <text x="830" y="407" fill="#A7F3D0" font-size="8.5" font-family="ui-monospace, monospace" text-anchor="middle">LOOP</text>

  <!-- QA Node -->
  <rect x="856" y="318" width="286" height="158" rx="8" fill="#111827" stroke="#34D399" stroke-width="1.8"/>
  <text x="872" y="340" fill="#F8FAFC" font-size="14" font-weight="700">QA Terminal</text>
  <text x="1128" y="340" fill="#34D399" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">Sonnet 5.5 · --chrome</text>
  <text x="872" y="362" fill="#E2E8F0" font-size="12" font-weight="600">3-Stage Verification Gate:</text>
  <text x="872" y="381" fill="#94A3B8" font-size="11.5">• A1 (Machine): Cross-family code/sec review</text>
  <text x="872" y="399" fill="#94A3B8" font-size="11.5">• A2 (Spec): qa-proof.py verify + mutations</text>
  <text x="872" y="417" fill="#94A3B8" font-size="11.5">• B (Product): Live Portal 375/768/1280px</text>
  <rect x="872" y="431" width="254" height="32" rx="6" fill="#064E3B" stroke="#10B981"/>
  <text x="999" y="445" fill="#A7F3D0" font-size="10.5" font-weight="700" text-anchor="middle">Direct QA ⇄ Dev Cord (`maestri connect`)</text>
  <text x="999" y="458" fill="#6EE7B7" font-size="9.5" text-anchor="middle">Manager wakes only on PASS, 3rd loop, or decision</text>

  <!-- Rollout + VPS Node -->
  <rect x="496" y="486" width="646" height="72" rx="8" fill="#111827" stroke="#F59E0B" stroke-width="1.4"/>
  <text x="512" y="508" fill="#F8FAFC" font-size="14" font-weight="700">Rollout ⇄ Production VPS Terminal</text>
  <text x="1128" y="508" fill="#FBBF24" font-size="11" font-family="ui-monospace, monospace" text-anchor="end">Claude Sonnet 5.5 + prod-guard.py</text>
  <text x="512" y="528" fill="#94A3B8" font-size="12">Runs /infra-preflight in Linux container before Dev when Infra: yes; verifies post-deploy health &amp; API routes</text>
  <text x="512" y="546" fill="#64748B" font-size="11" font-family="ui-monospace, monospace">Zero direct SQL in production · Read-only diagnostics via Rollout · Destructive commands blocked by prod-guard.py</text>

  <!-- BOTTOM LAYER: ON-DISK STATE & PRETOOLUSE GUARDRAILS -->
  <!-- Left Bottom: On-Disk State -->
  <rect x="40" y="594" width="630" height="162" rx="12" fill="#0F172A" stroke="#6366F1" stroke-width="1.6"/>
  <text x="60" y="620" fill="#A5B4FC" font-size="13" font-weight="700" letter-spacing="0.06em">DETERMINISTIC ON-DISK STATE (`planning/&lt;project&gt;/` · SURVIVES ANY RESET)</text>

  <rect x="58" y="634" width="188" height="106" rx="8" fill="#111827" stroke="#334155"/>
  <text x="72" y="655" fill="#F8FAFC" font-size="12.5" font-weight="700">1. Queue &amp; Specs</text>
  <text x="72" y="675" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">progress.md</text>
  <text x="72" y="693" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">epics/*.md · plan.md</text>
  <text x="72" y="711" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">ready/*_prd.md</text>
  <text x="72" y="729" fill="#64748B" font-size="10.5">Isolated from prd/&lt;n&gt; branch</text>

  <rect x="260" y="634" width="196" height="106" rx="8" fill="#111827" stroke="#334155"/>
  <text x="274" y="655" fill="#F8FAFC" font-size="12.5" font-weight="700">2. Order Ledger (`order.py`)</text>
  <text x="274" y="675" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">runs/&lt;prd&gt;/authorization.md</text>
  <text x="274" y="693" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">runs/&lt;prd&gt;/order-&lt;id&gt;.md</text>
  <text x="274" y="711" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">.order.lock (fcntl.flock)</text>
  <text x="274" y="729" fill="#64748B" font-size="10.5">SHA-256 sealed · exact quote req.</text>

  <rect x="470" y="634" width="182" height="106" rx="8" fill="#111827" stroke="#334155"/>
  <text x="484" y="655" fill="#F8FAFC" font-size="12.5" font-weight="700">3. QA Proof (`qa-proof.py`)</text>
  <text x="484" y="675" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">qa-proof-&lt;side&gt;.json</text>
  <text x="484" y="693" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">commit + tree + merge-base</text>
  <text x="484" y="711" fill="#94A3B8" font-size="11" font-family="ui-monospace, monospace">dirty_sha256 + lockfiles</text>
  <text x="484" y="729" fill="#64748B" font-size="10.5">QA verifies without rerunning suite</text>

  <!-- Right Bottom: PreToolUse Guardrails -->
  <rect x="690" y="594" width="470" height="162" rx="12" fill="#0F172A" stroke="#EF4444" stroke-width="1.6"/>
  <text x="710" y="620" fill="#FCA5A5" font-size="13" font-weight="700" letter-spacing="0.06em">DETERMINISTIC PRETOOLUSE HOOKS &amp; GOVERNANCE</text>

  <rect x="708" y="634" width="212" height="106" rx="8" fill="#111827" stroke="#334155"/>
  <text x="722" y="655" fill="#F8FAFC" font-size="12.5" font-weight="700">Context Ceiling &amp; Cost</text>
  <text x="722" y="675" fill="#FCA5A5" font-size="11" font-family="ui-monospace, monospace">context-ceiling.py</text>
  <text x="722" y="693" fill="#94A3B8" font-size="11">170k warn / 200k hard deny</text>
  <text x="722" y="711" fill="#94A3B8" font-size="11">Exempts order.py &amp; runs/ writes</text>
  <text x="722" y="729" fill="#64748B" font-size="10.5">prd-cost.py · role-check.py</text>

  <rect x="932" y="634" width="210" height="106" rx="8" fill="#111827" stroke="#334155"/>
  <text x="946" y="655" fill="#F8FAFC" font-size="12.5" font-weight="700">Git &amp; Prod Guardrails</text>
  <text x="946" y="675" fill="#FCA5A5" font-size="11" font-family="ui-monospace, monospace">pre-tool-use.js · prod-guard.py</text>
  <text x="946" y="693" fill="#94A3B8" font-size="11">Blocks push, --amend, --no-verify</text>
  <text x="946" y="711" fill="#94A3B8" font-size="11">Blocks compose down, rm -rf, sudo</text>
  <text x="946" y="729" fill="#64748B" font-size="10.5">Blocks prod SQL/DDL via markers</text>
</svg>
